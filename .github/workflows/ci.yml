name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

      - name: Validate CocoaPods specs
        shell: bash
        run: |
          set -euo pipefail

          pod lib lint TritonKitShared.podspec --allow-warnings --skip-tests
          pod lib lint TritonKit.podspec --include-podspecs=TritonKitShared.podspec --allow-warnings --skip-tests

      - name: Validate Homebrew formula template
        run: docs-linhay/scripts/verify-homebrew-formula.sh

  build-cli:
    name: Build CLI (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI
        run: swift build -c release --product triton

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "${{ matrix.arch }}" ]]; then
            echo "runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_arch}" >&2
            exit 1
          fi

          package_name="triton-macos-${{ matrix.arch }}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          cp ".build/release/triton" "${package_dir}/triton"
          chmod +x "${package_dir}/triton"

          cat > "${package_dir}/README.txt" <<README
          TritonKit CLI

          Install:
            cp triton /usr/local/bin/triton

          Homebrew:
            brew install NeptuneKit/tap/triton

          Verify:
            triton version --json
          README

          (
            cd dist
            tar -czf "${package_name}.tar.gz" "${package_name}"
            ditto -c -k --keepParent "${package_name}" "${package_name}.zip"
          )

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: triton-cli-${{ matrix.arch }}
          path: |
            dist/triton-macos-${{ matrix.arch }}.tar.gz
            dist/triton-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  package-release-assets:
    name: Package release assets
    needs: build-cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: triton-cli-*
          path: dist
          merge-multiple: true

      - name: Package skill artifact
        shell: bash
        run: |
          set -euo pipefail

          skills=(
            "tritonkit-dev-feedback"
            "tritonkit-real-project-regression"
          )

          mkdir -p dist

          for skill_name in "${skills[@]}"; do
            skill_dir=".agents/skills/${skill_name}"
            test -f "${skill_dir}/SKILL.md"

            (
              cd .agents/skills
              tar -czf "../../dist/${skill_name}.tar.gz" "${skill_name}"
              zip -qr "../../dist/${skill_name}.zip" "${skill_name}"
            )
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum *.tar.gz *.zip | sort -k 2 > tritonkit_checksums.txt
          )

      - name: Validate release asset set
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/triton-macos-arm64.tar.gz
          test -f dist/triton-macos-arm64.zip
          test -f dist/triton-macos-x86_64.tar.gz
          test -f dist/triton-macos-x86_64.zip
          test -f dist/tritonkit-dev-feedback.tar.gz
          test -f dist/tritonkit-dev-feedback.zip
          test -f dist/tritonkit-real-project-regression.tar.gz
          test -f dist/tritonkit-real-project-regression.zip
          test -f dist/tritonkit_checksums.txt

          docs-linhay/scripts/render-homebrew-formula.sh \
            "v0.1.0" \
            "dist/tritonkit_checksums.txt" \
            ".github/homebrew/triton.rb.template" \
            "/tmp/triton.rb"
          ruby -c /tmp/triton.rb >/dev/null

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tritonkit-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Automated TritonKit release for ${GITHUB_SHA}."
          fi

          gh release upload "${tag}" dist/* --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-release-assets
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      version: ${{ github.ref_name }}
      tap_repository: NeptuneKit/homebrew-tap
    secrets: inherit
