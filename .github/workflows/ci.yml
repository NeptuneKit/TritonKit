name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate
        run: docs-linhay/scripts/verify.sh --ci-validate

  build-cli:
    name: Build CLI (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(docs-linhay/scripts/resolve-ci-version.sh)"
          docs-linhay/scripts/write-cli-version.sh \
            "${version}" \
            "Sources/TritonKitCLI/main.swift"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "TritonKit CLI version: ${version}"

      - name: Build CLI
        run: swift build -c release --product triton

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "${{ matrix.arch }}" ]]; then
            echo "runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_arch}" >&2
            exit 1
          fi

          package_name="triton-macos-${{ matrix.arch }}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          cp ".build/release/triton" "${package_dir}/triton"
          chmod +x "${package_dir}/triton"

          cat > "${package_dir}/README.txt" <<README
          TritonKit CLI

          Version:
            ${{ steps.version.outputs.version }}

          Install:
            cp triton /usr/local/bin/triton

          Homebrew:
            brew install NeptuneKit/tap/triton

          Verify:
            triton version --json
          README

          (
            cd dist
            tar -czf "${package_name}.tar.gz" "${package_name}"
            ditto -c -k --keepParent "${package_name}" "${package_name}.zip"
          )

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: triton-cli-${{ matrix.arch }}
          path: |
            dist/triton-macos-${{ matrix.arch }}.tar.gz
            dist/triton-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  package-release-assets:
    name: Package release assets
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: triton-cli-*
          path: dist
          merge-multiple: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(docs-linhay/scripts/resolve-ci-version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "TritonKit release version: ${version}"

      - name: Package skill artifact
        shell: bash
        run: |
          set -euo pipefail

          skills=(
            "tritonkit-dev-feedback"
            "tritonkit-real-project-regression"
          )

          mkdir -p dist
          skills_work_dir="$(mktemp -d)"

          for skill_name in "${skills[@]}"; do
            skill_dir=".agents/skills/${skill_name}"
            test -f "${skill_dir}/SKILL.md"
            cp -R "${skill_dir}" "${skills_work_dir}/${skill_name}"
            docs-linhay/scripts/stamp-skill-version.sh \
              "${{ steps.version.outputs.version }}" \
              "${skills_work_dir}/${skill_name}/SKILL.md"

            (
              cd "${skills_work_dir}"
              tar -czf "${GITHUB_WORKSPACE}/dist/${skill_name}.tar.gz" "${skill_name}"
              zip -qr "${GITHUB_WORKSPACE}/dist/${skill_name}.zip" "${skill_name}"
            )
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum *.tar.gz *.zip | sort -k 2 > tritonkit_checksums.txt
          )

      - name: Validate release asset set
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/triton-macos-arm64.tar.gz
          test -f dist/triton-macos-arm64.zip
          test -f dist/triton-macos-x86_64.tar.gz
          test -f dist/triton-macos-x86_64.zip
          test -f dist/tritonkit-dev-feedback.tar.gz
          test -f dist/tritonkit-dev-feedback.zip
          test -f dist/tritonkit-real-project-regression.tar.gz
          test -f dist/tritonkit-real-project-regression.zip
          test -f dist/tritonkit_checksums.txt
          tar -xOf dist/tritonkit-dev-feedback.tar.gz tritonkit-dev-feedback/SKILL.md | grep -Fxq "  version: ${{ steps.version.outputs.version }}"
          tar -xOf dist/tritonkit-real-project-regression.tar.gz tritonkit-real-project-regression/SKILL.md | grep -Fxq "  version: ${{ steps.version.outputs.version }}"

          docs-linhay/scripts/render-homebrew-formula.sh \
            "v0.1.0" \
            "dist/tritonkit_checksums.txt" \
            ".github/homebrew/triton.rb.template" \
            "/tmp/triton.rb"
          ruby -c /tmp/triton.rb >/dev/null

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tritonkit-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Automated TritonKit release for ${GITHUB_SHA}."
          fi

          gh release upload "${tag}" dist/* --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-release-assets
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      version: ${{ github.ref_name }}
      tap_repository: NeptuneKit/homebrew-tap
    secrets: inherit
