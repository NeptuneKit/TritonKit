name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify-validate:
    name: Classify Validate Scope
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.validate-scope.outputs.mode }}
      is_release_tag: ${{ steps.validate-scope.outputs.is_release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify validate scope
        id: validate-scope
        env:
          TRITON_CI_BASE_SHA: ${{ github.event.before }}
        run: |
          mode="$(docs-linhay/scripts/ci-validate-mode.sh)"
          is_release_tag="false"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" || "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            is_release_tag="true"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "is_release_tag=${is_release_tag}" >> "${GITHUB_OUTPUT}"
          echo "validate mode: ${mode}"
          echo "release tag: ${is_release_tag}"

      - name: Validate docs and skills
        if: steps.validate-scope.outputs.mode == 'docs'
        run: docs-linhay/scripts/verify.sh --ci-docs

      - name: Validate short-path contracts
        if: steps.validate-scope.outputs.mode == 'contracts'
        run: |
          docs-linhay/scripts/verify-ci-validate-mode.sh
          docs-linhay/scripts/verify-homebrew-formula.sh
          docs-linhay/scripts/verify-version-stamping.sh
          docs-linhay/scripts/verify-release-automation.sh

  validate-swift:
    name: Validate Swift Tests
    needs: classify-validate
    if: needs.classify-validate.outputs.mode == 'full' || needs.classify-validate.outputs.mode == 'podkit' || needs.classify-validate.outputs.mode == 'swift'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore SwiftPM cache
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved', 'CLI/Package.swift', 'CLI/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: SwiftPM dependency boundary
        run: docs-linhay/scripts/verify-spm-dependency-boundary.sh

      - name: Swift tests
        run: swift test

      - name: CLI release build
        run: swift build --package-path CLI --scratch-path .build/cli -c release --product triton

  validate-podspec-kit:
    name: Validate Podspec (TritonKit)
    needs: classify-validate
    if: needs.classify-validate.outputs.mode == 'full' || needs.classify-validate.outputs.mode == 'podkit'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CocoaPods if needed
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

      - name: Validate podspec
        run: pod lib lint TritonKit.podspec --allow-warnings --skip-tests

  validate-contracts:
    name: Validate Contracts
    needs: classify-validate
    if: needs.classify-validate.outputs.mode == 'full' || needs.classify-validate.outputs.mode == 'podkit' || needs.classify-validate.outputs.mode == 'swift'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate CI scope classifier
        run: docs-linhay/scripts/verify-ci-validate-mode.sh

      - name: Validate Homebrew formula template
        run: docs-linhay/scripts/verify-homebrew-formula.sh

      - name: Validate version stamping scripts
        run: docs-linhay/scripts/verify-version-stamping.sh

      - name: Validate release automation contract
        run: docs-linhay/scripts/verify-release-automation.sh

  validate:
    name: Validate
    needs:
      - classify-validate
      - validate-swift
      - validate-podspec-kit
      - validate-contracts
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summarize validate result
        run: |
          set -euo pipefail

          mode="${{ needs.classify-validate.outputs.mode }}"
          echo "validate mode: ${mode}"
          echo "classify: ${{ needs.classify-validate.result }}"
          echo "swift: ${{ needs.validate-swift.result }}"
          echo "podspec-kit: ${{ needs.validate-podspec-kit.result }}"
          echo "contracts: ${{ needs.validate-contracts.result }}"

          if [[ "${{ needs.classify-validate.result }}" != "success" ]]; then
            echo "classification failed" >&2
            exit 1
          fi

          case "${mode}" in
            docs)
              ;;
            full)
              [[ "${{ needs.validate-swift.result }}" == "success" ]] || exit 1
              [[ "${{ needs.validate-podspec-kit.result }}" == "success" ]] || exit 1
              [[ "${{ needs.validate-contracts.result }}" == "success" ]] || exit 1
              ;;
            podkit)
              [[ "${{ needs.validate-swift.result }}" == "success" ]] || exit 1
              [[ "${{ needs.validate-podspec-kit.result }}" == "success" ]] || exit 1
              [[ "${{ needs.validate-contracts.result }}" == "success" ]] || exit 1
              ;;
            swift)
              [[ "${{ needs.validate-swift.result }}" == "success" ]] || exit 1
              [[ "${{ needs.validate-contracts.result }}" == "success" ]] || exit 1
              ;;
            contracts)
              ;;
            *)
              echo "unknown validate mode: ${mode}" >&2
              exit 1
              ;;
          esac

  build-cli-arm64:
    name: Build CLI (arm64)
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify-validate.outputs.is_release_tag == 'true' }}
    needs:
      - classify-validate
      - validate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Write CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(docs-linhay/scripts/resolve-ci-version.sh)"
          docs-linhay/scripts/write-cli-version.sh \
            "${version}" \
            "Sources/TritonKitCLI/CLIBuildInfo.swift"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "TritonKit CLI version: ${version}"

      - name: Build CLI
        run: swift build --package-path CLI --scratch-path .build/cli -c release --product triton

      - name: Build bundled Web static assets
        run: |
          npm --prefix Web ci
          npm --prefix Web run build

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "arm64" ]]; then
            echo "runner architecture mismatch: expected arm64, got ${actual_arch}" >&2
            exit 1
          fi

          package_name="triton-macos-arm64"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          cp ".build/cli/release/triton" "${package_dir}/triton"
          chmod +x "${package_dir}/triton"
          mkdir -p "${package_dir}/web"
          cp -R "Web/dist/." "${package_dir}/web/"

          cat > "${package_dir}/README.txt" <<README
          TritonKit CLI

          Version:
            ${{ steps.version.outputs.version }}

          Install:
            cp triton /usr/local/bin/triton
            mkdir -p /usr/local/share/triton/web
            cp -R web/. /usr/local/share/triton/web/

          Homebrew:
            brew install NeptuneKit/tap/triton

          Verify:
            triton version --json

          Bundled Web:
            triton web starts the bundled Web Device Hub from ./web.
          README

          (
            cd dist
            tar -czf "${package_name}.tar.gz" "${package_name}"
          )

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: triton-cli-arm64
          path: |
            dist/triton-macos-arm64.tar.gz
          if-no-files-found: error

  build-cli-x86_64:
    name: Build CLI (x86_64)
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify-validate.outputs.is_release_tag == 'true' }}
    needs:
      - classify-validate
      - validate
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Write CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(docs-linhay/scripts/resolve-ci-version.sh)"
          docs-linhay/scripts/write-cli-version.sh \
            "${version}" \
            "Sources/TritonKitCLI/CLIBuildInfo.swift"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "TritonKit CLI version: ${version}"

      - name: Build CLI
        run: swift build --package-path CLI --scratch-path .build/cli -c release --product triton

      - name: Build bundled Web static assets
        run: |
          npm --prefix Web ci
          npm --prefix Web run build

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "x86_64" ]]; then
            echo "runner architecture mismatch: expected x86_64, got ${actual_arch}" >&2
            exit 1
          fi

          package_name="triton-macos-x86_64"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}"
          cp ".build/cli/release/triton" "${package_dir}/triton"
          chmod +x "${package_dir}/triton"
          mkdir -p "${package_dir}/web"
          cp -R "Web/dist/." "${package_dir}/web/"

          cat > "${package_dir}/README.txt" <<README
          TritonKit CLI

          Version:
            ${{ steps.version.outputs.version }}

          Install:
            cp triton /usr/local/bin/triton
            mkdir -p /usr/local/share/triton/web
            cp -R web/. /usr/local/share/triton/web/

          Homebrew:
            brew install NeptuneKit/tap/triton

          Verify:
            triton version --json

          Bundled Web:
            triton web starts the bundled Web Device Hub from ./web.
          README

          (
            cd dist
            tar -czf "${package_name}.tar.gz" "${package_name}"
          )

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: triton-cli-x86_64
          path: |
            dist/triton-macos-x86_64.tar.gz
          if-no-files-found: error

  package-release-assets:
    name: Package arm64 release assets
    needs: build-cli-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download CLI artifacts
        uses: actions/download-artifact@v7
        with:
          name: triton-cli-arm64
          path: dist

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(docs-linhay/scripts/resolve-ci-version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "TritonKit release version: ${version}"

      - name: Package skill artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          package_args=(
            docs-linhay/scripts/package-public-skills.py
            --version "${{ steps.version.outputs.version }}"
            --output dist/tritonkit-skills.tar.gz
            --json
          )
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            package_args+=(--release-tag "${GITHUB_REF_NAME}")
          fi
          "${package_args[@]}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum *.tar.gz | sort -k 2 > tritonkit_checksums.txt
          )

      - name: Validate release asset set
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/triton-macos-arm64.tar.gz
          test -f dist/tritonkit-skills.tar.gz
          test -f dist/tritonkit_checksums.txt
          arm64_contents="$(mktemp)"
          tar -tf dist/triton-macos-arm64.tar.gz > "${arm64_contents}"
          grep -Eq '^triton-macos-arm64/web/index[.]html$' "${arm64_contents}"
          arm64_readme="$(mktemp)"
          tar -xOf dist/triton-macos-arm64.tar.gz triton-macos-arm64/README.txt > "${arm64_readme}"
          grep -Fq 'triton web starts the bundled Web Device Hub from ./web.' "${arm64_readme}"
          ! compgen -G "dist/*.zip" >/dev/null
          ! test -f dist/tritonkit-dev-feedback.tar.gz
          ! test -f dist/tritonkit-emulator-cli-takeover.tar.gz
          ! test -f dist/tritonkit-real-project-regression.tar.gz
          ! test -f dist/tritonkit-update.tar.gz
          expected_skill_version_line="  version: ${{ steps.version.outputs.version }}"
          for skill_name in \
            tritonkit-dev-feedback \
            tritonkit-emulator-cli-takeover \
            tritonkit-real-project-regression \
            tritonkit-update; do
            skill_version_line="$(
              tar -xOf dist/tritonkit-skills.tar.gz "TritonKit.skills/${skill_name}/SKILL.md" \
                | sed -n 's/^  version: .*/&/p'
            )"
            [[ "${skill_version_line}" == "${expected_skill_version_line}" ]]
          done
          tar -xOf dist/tritonkit-skills.tar.gz TritonKit.skills/BUILD_INFO.json > /tmp/tritonkit-skills-build-info.json
          python3 - <<'PY'
          import json

          with open("/tmp/tritonkit-skills-build-info.json", encoding="utf-8") as handle:
              build_info = json.load(handle)

          expected_skills = [
              "tritonkit-dev-feedback",
              "tritonkit-emulator-cli-takeover",
              "tritonkit-real-project-regression",
              "tritonkit-update",
          ]
          assert build_info["name"] == "tritonkit-skills"
          assert build_info["bundlePath"] == "TritonKit.skills/"
          assert build_info["version"] == "${{ steps.version.outputs.version }}"
          assert [skill["name"] for skill in build_info["skills"]] == expected_skills
          assert all(skill["version"] == "${{ steps.version.outputs.version }}" for skill in build_info["skills"])
          PY

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            formula_tag="${GITHUB_REF_NAME}"
            docs-linhay/scripts/render-homebrew-formula.sh \
              "${formula_tag}" \
              "dist/tritonkit_checksums.txt" \
              ".github/homebrew/triton.rb.template" \
              "/tmp/triton.rb"
            ruby -c /tmp/triton.rb >/dev/null
          else
            echo "skip Homebrew formula rendering for non-tag release asset validation"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tritonkit-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "skip GitHub release upload for non-tag run"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Automated TritonKit release for ${GITHUB_SHA}."
          fi

          gh release upload "${tag}" dist/* --clobber

  publish-x86-release-asset:
    name: Publish x86_64 release asset
    if: ${{ needs.classify-validate.outputs.is_release_tag == 'true' }}
    needs:
      - classify-validate
      - package-release-assets
      - build-cli-x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download x86_64 CLI artifact
        uses: actions/download-artifact@v7
        with:
          name: triton-cli-x86_64
          path: dist

      - name: Merge release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          gh release download "${tag}" \
            --pattern tritonkit_checksums.txt \
            --dir dist \
            --clobber

          (
            cd dist
            x86_contents="$(mktemp)"
            tar -tf triton-macos-x86_64.tar.gz > "${x86_contents}"
            grep -Eq '^triton-macos-x86_64/web/index[.]html$' "${x86_contents}"
            x86_readme="$(mktemp)"
            tar -xOf triton-macos-x86_64.tar.gz triton-macos-x86_64/README.txt > "${x86_readme}"
            grep -Fq 'triton web starts the bundled Web Device Hub from ./web.' "${x86_readme}"
            grep -v 'triton-macos-x86_64[.]tar[.]gz$' tritonkit_checksums.txt > tritonkit_checksums.merged.txt
            sha256sum triton-macos-x86_64.tar.gz >> tritonkit_checksums.merged.txt
            sort -k 2 tritonkit_checksums.merged.txt > tritonkit_checksums.txt
          )

      - name: Publish x86_64 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${GITHUB_REF_NAME}" \
            dist/triton-macos-x86_64.tar.gz \
            dist/tritonkit_checksums.txt \
            --clobber

  update-homebrew-tap:
    name: Update Homebrew tap (arm64)
    if: ${{ needs.classify-validate.outputs.is_release_tag == 'true' }}
    needs:
      - classify-validate
      - package-release-assets
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      version: ${{ github.ref_name }}
      tap_repository: NeptuneKit/homebrew-tap
    secrets: inherit

  update-homebrew-tap-x86:
    name: Update Homebrew tap (x86_64 backfill)
    if: ${{ needs.classify-validate.outputs.is_release_tag == 'true' }}
    needs:
      - classify-validate
      - publish-x86-release-asset
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      version: ${{ github.ref_name }}
      tap_repository: NeptuneKit/homebrew-tap
    secrets: inherit
