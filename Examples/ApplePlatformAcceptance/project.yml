name: ApplePlatformAcceptance
options:
  bundleIdPrefix: dev.tritonkit.acceptance
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  TVAcceptance:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources: [TVApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tritonkit.acceptance.tv
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TVAcceptanceUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources: [SharedTests, TVTests]
    dependencies:
      - target: TVAcceptance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tritonkit.acceptance.tv.uitests
        TEST_TARGET_NAME: TVAcceptance
  WatchAcceptance:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [WatchApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tritonkit.acceptance.watch
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
  WatchAcceptanceUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [SharedTests, WatchTests]
    dependencies:
      - target: WatchAcceptance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tritonkit.acceptance.watch.uitests
        TEST_TARGET_NAME: WatchAcceptance
schemes:
  TVAcceptance:
    build:
      targets:
        TVAcceptance: all
        TVAcceptanceUITests: [test]
    test:
      targets: [TVAcceptanceUITests]
      gatherCoverageData: false
  WatchAcceptance:
    build:
      targets:
        WatchAcceptance: all
        WatchAcceptanceUITests: [test]
    test:
      targets: [WatchAcceptanceUITests]
      gatherCoverageData: false
